name: adr-probe

# One-off diagnosis: what the ADR book's home-market data looks like (why it found no home sessions).

on:
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/adr-probe.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Probe
        run: |
          python - <<'PY'
          import pandas as pd
          from qtrade.intraday.adr_book import ADRS, home_moves
          from qtrade.data.loader import download_prices
          pd.set_option("display.width", 250); pd.set_option("display.max_columns", 60)
          homes = sorted({h for h, _, _ in ADRS.values()})
          fxs = sorted({f.removeprefix("1/") for _, f, _ in ADRS.values()})
          md = download_prices(homes + fxs, start="2026-10-20")
          print("index:", md.close.index[-6:].tolist(), "tz:", md.close.index.tz)
          print(md.close.iloc[-5:, :12].round(2))
          print("last valid date per ticker:")
          print(md.close.apply(lambda s: s.last_valid_index()).value_counts())
          for d in ["2026-10-30", "2026-11-02", "2026-11-03"]:
              m = home_moves(pd.Timestamp(d))
              print(d, "->", len(m), "ADRs with a home session;", m.groupby("market").size().to_dict() if len(m) else {})
          import yfinance as yf
          raw = yf.download(["0700.HK", "7203.T", "INFY.NS"], start="2026-10-28", auto_adjust=False, progress=False)
          print(raw["Close"]); print("raw index:", raw.index)
          PY
