name: crm-probe

# One-off: can a runner read MODIS daily thermal anomalies (MOD14A1) from Microsoft's Planetary Computer?

on:
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/crm-probe.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests rasterio numpy
      - name: Planetary Computer
        run: |
          python - <<'PY'
          import requests, numpy as np, rasterio
          from rasterio.warp import transform
          S = "https://planetarycomputer.microsoft.com/api/stac/v1"
          for coll in ["modis-14A1-061", "modis-14A2-061"]:
              r = requests.get(f"{S}/collections/{coll}", timeout=60); print(coll, r.status_code)
          # Morowali (IMIP) nickel smelters, Indonesia; Norilsk
          import os; os.environ["GDAL_HTTP_MAX_RETRY"] = "3"
          for name, lon, lat in [("IMIP Morowali", 122.16, -2.83), ("Norilsk", 88.20, 69.35)]:
              body = {"collections": ["modis-14A1-061"], "intersects": {"type": "Point", "coordinates": [lon, lat]},
                      "datetime": "2024-01-01/2024-01-20", "limit": 5}
              r = requests.post(f"{S}/search", json=body, timeout=60); feats = r.json().get("features", [])
              print(name, "search", r.status_code, len(feats), "items")
              if not feats: continue
              it = feats[0]; print(" item", it["id"], "assets", list(it["assets"])[:12])
              for key in [k for k in it["assets"] if "FRP" in k or "FireMask" in k][:2]:
                  raw = it["assets"][key]["href"]; print("  raw href", raw[:120])
                  href = requests.get("https://planetarycomputer.microsoft.com/api/sas/v1/sign", params={"href": raw}, timeout=60).json()["href"]
                  with rasterio.open(href) as ds:
                      xs, ys = transform("EPSG:4326", ds.crs, [lon], [lat])
                      row, col = ds.index(xs[0], ys[0])
                      win = ds.read(1, window=((max(row-10,0), row+10), (max(col-10,0), col+10)))
                      print(" ", key, ds.count, "bands", ds.shape, ds.dtypes[0], "window max", int(win.max()), "nonzero", int((win > 0).sum()))
          PY
