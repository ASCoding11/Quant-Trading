name: crm-research

# Critical raw materials vs satellite data (qtrade/data/satellite.py, qtrade/research/crm_satellite.py):
# MODIS daily thermal anomalies at ~25 smelters / refineries from Microsoft's Planetary Computer (no key),
# 2012 to today, cached per year; then whether the plants' activity predicts copper, platinum, palladium,
# aluminium futures (and the nickel / rare-earth ETFs). Since May 2018 also the Sentinel-5P SO2 plume over
# the same plants (qtrade/data/sentinel5p.py), collected one year per parallel job. The satellite data
# (NASA / ESA Copernicus, free) is kept as assets of the "satellite-modis" and "satellite-s5p" releases; the
# report and crm_rules.json (the $0 CRM tracker's directions) go to research/crm/ on the results branch.

on:
  workflow_dispatch:
    inputs:
      start:
        description: "first day of satellite data"
        default: "2012-01-01"
      refetch:
        description: "SO2 months to collect again although cached, space-separated (e.g. 2021-05 2021-06)"
        default: ""

permissions:
  contents: write

concurrency:
  group: crm-research
  cancel-in-progress: false

jobs:
  s5p-release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          gh release view satellite-s5p >/dev/null 2>&1 || gh release create satellite-s5p --title "Satellite: Sentinel-5P SO2 at CRM plants" \
            --notes "Per overpass: TROPOMI SO2 column (1 km plume product) over critical-raw-material smelters minus a 60-120 km background ring, one parquet per month (qtrade/data/sentinel5p.py). ESA Copernicus Sentinel data, free and open; source: Microsoft Planetary Computer, sentinel-5p-l2-netcdf."

  s5p:
    needs: s5p-release
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        year: [2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025, 2026]
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt h5py fsspec aiohttp
      - name: Months already collected
        run: |
          mkdir -p data/satellite
          gh release download satellite-s5p -p "s5p_${{ matrix.year }}-*.parquet" -D data/satellite || true
          for m in $REFETCH; do rm -f "data/satellite/s5p_$m.parquet"; done
        env:
          REFETCH: ${{ inputs.refetch }}
      - name: Collect SO2 over the plants
        run: |
          END="${{ matrix.year }}-12-31"; TODAY=$(date -u +%F); [[ "$END" > "$TODAY" ]] && END=$TODAY
          timeout 320m python -m qtrade.data.sentinel5p --start "${{ matrix.year }}-01-01" --end "$END" --cache data/satellite
      - name: Keep the months in the release
        if: always()
        run: |
          ls data/satellite/s5p_*.parquet >/dev/null 2>&1 || exit 0
          gh release upload satellite-s5p data/satellite/s5p_*.parquet --clobber

  study:
    needs: s5p
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt rasterio h5py fsspec aiohttp
      - name: Satellite cache
        uses: actions/cache/restore@v4
        with:
          path: data/satellite
          key: satellite-${{ github.run_id }}
          restore-keys: satellite-
      - name: Satellite data from the releases
        run: |
          mkdir -p data/satellite
          ls data/satellite/modis_*.parquet >/dev/null 2>&1 || gh release download satellite-modis -p "modis_*.parquet" -D data/satellite || true
          gh release download satellite-s5p -p "s5p_*.parquet" -D data/satellite --clobber || true
      - name: Collect MODIS thermal anomalies
        run: timeout 300m python -m qtrade.data.satellite --start "${{ inputs.start || '2012-01-01' }}" --end "$(date -u +%F)" --cache data/satellite
      - name: Save the cache (also after a timeout)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/satellite
          key: satellite-${{ github.run_id }}
      - name: Keep the satellite data in a release
        if: always()
        run: |
          ls data/satellite/modis_*.parquet >/dev/null 2>&1 || exit 0
          gh release view satellite-modis >/dev/null 2>&1 || gh release create satellite-modis --title "Satellite: MODIS thermal anomalies at CRM plants" \
            --notes "Daily MODIS (Terra + Aqua) fire pixels and fire radiative power around critical-raw-material smelters and refineries (qtrade/data/satellite.py). NASA data, public domain; source: Microsoft Planetary Computer, modis-14A1-061."
          gh release upload satellite-modis data/satellite/modis_*.parquet --clobber
      - name: Study
        run: python -m qtrade.research.crm_satellite --sat-cache data/satellite --out reports/crm
      - name: Store the report
        if: always()
        run: |
          ls reports/crm/* >/dev/null 2>&1 || exit 0
          cat reports/crm/crm_satellite.md >> "$GITHUB_STEP_SUMMARY"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            RES=$(mktemp -d)
            (
              cd "$RES" && git init -q
              git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
              git fetch -q --depth 1 origin results && git checkout -q -B results FETCH_HEAD
              mkdir -p research/crm
              cp "$GITHUB_WORKSPACE"/reports/crm/* research/crm/
              git add -A research/crm
              git commit -q -m "CRM satellite study (run ${GITHUB_RUN_ID})" || exit 0
              git push -q origin results
            ) && break
            sleep $((attempt * 5))
          done
