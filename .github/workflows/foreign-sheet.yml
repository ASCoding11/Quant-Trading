name: foreign-sheet

# Overnight persistence on Asian exchanges as a sleeve of the simulated $10,000 sheet book
# (qtrade/intraday/foreign_sheet.py): after the last Asian market (Mumbai) closes, each open book
# is settled at the official open and each market that traded today opens tonight's book at its
# official close - in the sheet's "Foreign book" and "Foreign trades" tabs. Nothing goes to a broker.

on:
  schedule:
    - cron: "41 11 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foreign-sheet
  cancel-in-progress: false

jobs:
  sleeve:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      HFT_SHEET_ID: ${{ secrets.HFT_SHEET_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m qtrade.intraday.foreign_sheet
