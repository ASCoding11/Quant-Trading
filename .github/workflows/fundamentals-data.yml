name: fundamentals-data

# Downloads company fundamentals (income statement, balance sheet, cash flow,
# share counts) for the universe from SEC EDGAR's free XBRL API, with the date
# each number was filed so backtests never see it early. Stored in the release
# "data" as fundamentals.tar.part00. Refreshed monthly.
#
# The SEC asks automated users to identify themselves. If a run fails with a
# 403, add a repository variable SEC_USER_AGENT such as "Your Name you@example.com".

on:
  workflow_dispatch:
  schedule:
    - cron: "0 11 2 * *"   # 2nd of each month

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore the stock universe from earlier runs
        uses: actions/cache/restore@v4
        with:
          path: data
          key: fundamentals-universe-${{ github.run_id }}
          restore-keys: |
            live-
            prices-
      - name: Select universe (if no earlier run left one)
        run: '[ -f data/universe.csv ] || python -m qtrade universe'
      - name: Download from SEC EDGAR
        run: python -m qtrade fundamentals --store data/fundamentals
      - name: Save to the release and publish the manifest
        run: |
          source scripts/datastore.sh
          save_dataset fundamentals fundamentals
          publish_manifest fundamentals fundamentals
