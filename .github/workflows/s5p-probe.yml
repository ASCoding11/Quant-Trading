name: s5p-probe

# One-off: what Sentinel-5P SO2 data the Planetary Computer serves and how fast parts of it can be read.

on:
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/s5p-probe.yml", "scripts/s5p_probe.py"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests numpy h5py fsspec aiohttp
      - run: python scripts/s5p_probe.py
