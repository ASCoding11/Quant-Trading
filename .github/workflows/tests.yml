name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Unit tests (including the no-look-ahead test for every signal)
        run: python -m pytest -q
      - name: End-to-end demo on a synthetic market
        run: python -m qtrade demo --stocks 120 --days 1800 --models ridge,regime_ridge,ic_weighted --out reports/demo
      - uses: actions/upload-artifact@v4
        with:
          name: demo-report
          path: reports/demo
