name: weekly-review

# The weekly review of the $10,000 sheet book (qtrade/intraday/weekly_review.py): every Saturday each
# sleeve's live record is compared with its backtest under the fixed rule in config/review.json, and the
# result goes to the sheet's "Weekly review" tab. It only proposes; changes to config/sheet_book.json go
# in by pull request.

on:
  schedule:
    - cron: "17 14 * * 6"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-review
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      HFT_SHEET_ID: ${{ secrets.HFT_SHEET_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m qtrade.intraday.weekly_review
